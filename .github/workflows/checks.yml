name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '**/requirements.txt'
      - run: pip install -r tools/requirements.txt -r sandbox/operators/minimal/requirements.txt ruff==0.17.3
      - run: ruff check . && ruff format --check .
      - run: python -m unittest discover -s tests/unit -v
      - run: bash -n run.sh tests/smoke.sh
      - run: shellcheck run.sh tests/smoke.sh
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: tests/runs/
