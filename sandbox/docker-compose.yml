services:
  target:
    build: 
      context: ./targets/${TARGET:-minimal}
    networks:
      - graphos_net
    ports:
      - "8080:80"

  tools:
    build:
      context: ../tools
      dockerfile: Dockerfile
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
    networks:
      - graphos_net
    ports:
      - "8000:8000"

  operator:
    build:
      context: ./operators/${OPERATOR:-minimal}
    env_file:
      - ../.env
    environment:
      - TARGET_URL=http://target:80
      - MCP_SERVER_URL=http://tools:8000/sse
      - LOG_DIR=/app/tests
      - LOG_NAME=${LOG_NAME}
      - OPERATOR_NAME=${OPERATOR:-minimal}
      - TARGET_NAME=${TARGET:-minimal}
      - PROFILE_NAME=${PROFILE:-default}
    volumes:
      - ./operators/${OPERATOR:-minimal}/agent.py:/app/agent.py:ro
      - ../tests/logs:/app/tests
      - ${PROFILE_PATH:-../tests/profiles/default.json}:/app/profile.json:ro
    networks:
      - graphos_net
    depends_on:
      - target

networks:
  graphos_net:
    driver: bridge